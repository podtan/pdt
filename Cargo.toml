[package]
name = "pdt"
version = "0.2.1"
edition = "2021"
description = "Platform Data Toolkit - Enterprise Knowledge Silo API Server"
license = "MIT OR Apache-2.0"
authors = ["Podtan Team"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "request-id"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OpenAPI
utoipa = { version = "5", features = ["chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Database
mongodb = { version = "3", features = ["rustls-tls"] }
bson = { version = "2", features = ["chrono-0_4", "uuid-1"] }

# Authentication & Authorization
cedar-policy = "4"

# PEP library
pep = { version = "0.5", features = ["cedar", "oidc-resource-server", "config", "axum"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
regex = "1"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# HTTP client (for OIDC userinfo enrichment)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tokio-test = "0.4"
