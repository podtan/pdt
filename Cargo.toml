[package]
name = "pdt"
version = "0.1.0"
edition = "2021"
description = "Platform Data Toolkit - Enterprise Knowledge Silo API Server"
license = "MIT OR Apache-2.0"
authors = ["Podtan Team"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "request-id"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
mongodb = { version = "3", features = ["rustls-tls"] }
bson = { version = "2", features = ["chrono-0_4", "uuid-1"] }

# Authentication
pep = { path = "../pep", features = ["oidc-resource-server", "config", "axum"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
regex = "1"

# Async utilities
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
