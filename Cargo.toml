[package]
name = "pdt"
version = "0.3.5"
edition = "2021"
description = "Asset store API with relation graphs, tagging, full-text search, multi-instance SQLite tenancy, OIDC auth and Cedar authorization"
license = "MIT OR Apache-2.0"
authors = ["Podtan Team"]
repository = "https://github.com/podtan/pdt"
readme = "README.md"
keywords = ["database", "api-server", "search", "cedar", "multi-tenant"]
categories = ["database-implementations", "authentication", "web-programming::http-server"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "request-id"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OpenAPI
utoipa = { version = "5", features = ["chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Database — MongoDB (DocumentDB) backend
mongodb = { version = "3", features = ["rustls-tls"] }
bson = { version = "2", features = ["chrono-0_4", "uuid-1"] }

# Database — SQLite (ALSO load-bearing for multi-tenant instance routing:
# every instance leaf is a SQLite DB via tenant.rs, independent of the root
# backend — sqlx is therefore a non-optional dependency. The `sqlite-backend`
# feature continues to gate only the ROOT-database repository selection.)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }

# Authentication & Authorization
cedar-policy = "4"

# PEP library
pep = { version = "0.5", features = ["cedar", "oidc-resource-server", "config", "axum"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
regex = "1"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# HTTP client (for OIDC userinfo enrichment)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[features]
default = ["mongodb-backend"]
mongodb-backend = []
# Gates only the ROOT-database repository selection (sqlite asset/relation/
# collection/audit repositories). Instance-leaf routing (tenant.rs) uses sqlx
# unconditionally — see the sqlx dependency note above.
sqlite-backend = []

[dev-dependencies]
tokio-test = "0.4"
